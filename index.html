<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIV PREM SYSTEMATIC AI GROWTH AND WEALTH BUILDING</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas & jsPDF for PDF Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Tesseract.js for Photo OCR Data Extraction -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        poster: ['Anton', 'Oswald', 'Noto Sans Tamil', 'sans-serif'],
                        heading: ['Oswald', 'Noto Sans Tamil', 'sans-serif'],
                        sans: ['Inter', 'Noto Sans Tamil', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        matteBlack: '#090a0f',
                        panelDark: '#12151e',
                        cyberBlue: '#3b82f6',
                        posterYellow: '#facc15',
                        emeraldGrowth: '#22c55e',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-inset: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --border-card: #cbd5e1;
            --shadow-card: 5px 5px 0px #1e3a8a;
            --grid-dot: rgba(15, 23, 42, 0.06);
        }
        html.dark {
            --bg-main: #090a0f;
            --bg-card: #12151e;
            --bg-inset: #090a0f;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-card: #1e293b;
            --shadow-card: 5px 5px 0px #000000;
            --grid-dot: rgba(255, 255, 255, 0.035);
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
            background-size: 20px 20px;
            transition: background-color 0.25s ease, color 0.25s ease;
            min-height: 100vh;
        }
        html:not(.dark) .text-white {
            color: #0f172a !important;
        }
        html:not(.dark) .text-slate-100,
        html:not(.dark) .text-slate-200,
        html:not(.dark) .text-slate-300 {
            color: #1e293b !important;
        }
        html:not(.dark) .bg-slate-900 {
            background-color: #e2e8f0 !important;
            color: #0f172a !important;
        }

        .poster-title { font-family: 'Anton', 'Oswald', 'Noto Sans Tamil', sans-serif; letter-spacing: 0.03em; text-transform: uppercase; }
        .comic-card { background-color: var(--bg-card); border: 2px solid var(--border-card); box-shadow: var(--shadow-card); }
        .inset-box { background-color: var(--bg-inset); border: 1.5px solid var(--border-card); }
        .muted-text { color: var(--text-secondary); }

        @media (min-width: 1024px) {
            .lg\:grid-cols-13 {
                grid-template-columns: repeat(13, minmax(0, 1fr));
            }
        }

        @keyframes botGentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        .bot-figure-anim { animation: botGentleFloat 2.8s infinite ease-in-out; }

        @keyframes stablePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }
        .stable-current-dot { animation: stablePulse 1.8s infinite ease-in-out; }
    </style>
</head>
<body class="antialiased pb-24 p-3 sm:p-6">

    <!-- Hidden File Input for Importing Whole Data -->
    <input type="file" id="importWholeDataInput" accept=".json,application/json" class="hidden" onchange="importWholeData(event)">
    <!-- Hidden File Input for Bot Photo / Document Upload -->
    <input type="file" id="botPhotoUploadInput" accept="image/*,.txt,.csv,.json" class="hidden" onchange="handleBotPhotoOrDocUpload(event)">

    <!-- Toast Notification -->
    <div id="comicToast" class="fixed bottom-24 right-5 z-50 transform translate-y-28 opacity-0 transition-all duration-300 bg-posterYellow text-matteBlack border-2 border-slate-900 px-4 py-3 rounded-xl shadow-[5px_5px_0px_#3b82f6] flex items-center gap-3">
        <span class="text-xl">⚡</span>
        <div>
            <div id="toastTitle" class="font-poster text-sm">UPDATED!</div>
            <div id="toastDesc" class="text-xs font-bold">Dashboard synced.</div>
        </div>
    </div>

    <!-- Floating Bot Figure Only (No Surrounding Blue Circle) -->
    <div class="fixed bottom-6 right-6 z-40">
        <button type="button" onclick="toggleFloatingBot()" class="p-1.5 rounded-2xl bg-slate-900/90 border-2 border-posterYellow shadow-[4px_4px_0px_#000] flex items-center justify-center hover:scale-105 transition bot-figure-anim" title="SHIV PREM AI">
            <svg viewBox="0 0 40 44" class="w-11 h-11" xmlns="http://www.w3.org/2000/svg">
                <line x1="20" y1="3" x2="20" y2="9" stroke="#facc15" stroke-width="2.4" stroke-linecap="round"/>
                <circle cx="20" cy="3" r="2.2" fill="#facc15"/>
                <rect x="8" y="9" width="24" height="17" rx="6" fill="#3b82f6" stroke="#facc15" stroke-width="2"/>
                <circle cx="15" cy="17.5" r="2.3" fill="#ffffff"/>
                <circle cx="25" cy="17.5" r="2.3" fill="#ffffff"/>
                <path d="M 15.5 22 Q 20 24.5 24.5 22" stroke="#facc15" stroke-width="2" stroke-linecap="round" fill="none"/>
                <rect x="11" y="28" width="18" height="11" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8"/>
                <circle cx="20" cy="33.5" r="2" fill="#22c55e"/>
            </svg>
        </button>
    </div>

    <!-- Bot Modal: Chat Window on Top + Small Doc/Photo & Voice Icons Below -->
    <div id="floatingBotModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-3">
        <div class="comic-card w-full max-w-2xl rounded-2xl p-4 sm:p-6 bg-matteBlack text-white max-h-[92vh] flex flex-col border-cyberBlue overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700 mb-3">
                <div class="flex items-center gap-3">
                    <svg viewBox="0 0 40 44" class="w-9 h-10 bot-figure-anim" xmlns="http://www.w3.org/2000/svg">
                        <line x1="20" y1="3" x2="20" y2="9" stroke="#facc15" stroke-width="2.4" stroke-linecap="round"/>
                        <circle cx="20" cy="3" r="2.2" fill="#facc15"/>
                        <rect x="8" y="9" width="24" height="17" rx="6" fill="#3b82f6" stroke="#facc15" stroke-width="2"/>
                        <circle cx="15" cy="17.5" r="2.3" fill="#ffffff"/>
                        <circle cx="25" cy="17.5" r="2.3" fill="#ffffff"/>
                        <path d="M 15.5 22 Q 20 24.5 24.5 22" stroke="#facc15" stroke-width="2" stroke-linecap="round" fill="none"/>
                        <rect x="11" y="28" width="18" height="11" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8"/>
                    </svg>
                    <div>
                        <h3 class="poster-title text-xl text-posterYellow" data-i18n="botTitle">SHIV PREM AI</h3>
                        <p class="text-xs text-slate-400" data-i18n="botSub">Chat, Voice &amp; Chart / Dashboard Sync</p>
                    </div>
                </div>
                <button type="button" onclick="toggleFloatingBot()" class="text-slate-400 hover:text-white font-mono text-lg px-2">✕</button>
            </div>

            <div id="botArrangedDetails" class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs font-mono mb-3"></div>

            <div class="grid grid-cols-3 gap-2 mb-3 text-xs font-mono">
                <button type="button" onclick="switchBotTopic('finance')" id="bot-tab-finance" class="py-2 px-2 rounded-xl font-bold bg-posterYellow text-matteBlack transition" data-i18n="botTabFinance">
                    Financial Assistant
                </button>
                <button type="button" onclick="switchBotTopic('growth')" id="bot-tab-growth" class="py-2 px-2 rounded-xl font-bold bg-slate-800 text-slate-200 hover:bg-slate-700 transition" data-i18n="botTabGrowth">
                    Personal Growth
                </button>
                <button type="button" onclick="switchBotTopic('nextplan')" id="bot-tab-nextplan" class="py-2 px-2 rounded-xl font-bold bg-slate-800 text-slate-200 hover:bg-slate-700 transition" data-i18n="botTabNextPlan">
                    Next Plan
                </button>
            </div>

            <!-- 1. Chat Window -->
            <div id="botChatWindow" class="bg-slate-900 border border-slate-700 rounded-xl p-3.5 h-48 overflow-y-auto space-y-3 mb-3 text-sm font-mono"></div>

            <!-- Chat Input Form -->
            <form onsubmit="handleBotSubmit(event)" class="flex gap-2 mb-3">
                <input type="text" id="botUserInput" required data-i18n-placeholder="botPlaceholder" placeholder="Type or speak to Shiv Prem AI..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-posterYellow font-mono">
                <button type="submit" class="bg-cyberBlue hover:bg-blue-600 text-white font-poster text-sm px-5 py-2.5 rounded-xl tracking-wider" data-i18n="sendBtn">ASK ⚡</button>
            </form>

            <!-- 2. Below Chat: Small Icons for Doc/Photo Post & Voice Conversation + Chart/Dashboard Sync -->
            <div class="inset-box rounded-xl p-3 space-y-2 text-xs font-mono border-cyberBlue">
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="toggleBotDocDrawer()" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-posterYellow hover:text-matteBlack text-posterYellow border border-slate-600 flex items-center justify-center text-sm transition" title="Post Document / Photo">
                            📎
                        </button>
                        <button type="button" onclick="toggleBotVoiceConversation()" id="botVoiceMicBtn" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-emeraldGrowth hover:text-matteBlack text-emeraldGrowth border border-slate-600 flex items-center justify-center text-sm transition" title="Speak Conversation">
                            🎤
                        </button>
                        <span id="botVoiceStatusText" class="text-[11px] text-slate-400"></span>
                    </div>
                    <button type="button" onclick="applyDocAndPhotoDataToDashboard()" class="px-3 py-1 rounded-lg bg-emeraldGrowth hover:bg-green-400 text-matteBlack font-extrabold text-[11px]" data-i18n="botApplyDocBtn">
                        ⚡ Sync Chart &amp; Dashboard
                    </button>
                </div>

                <div id="botDocDrawer" class="space-y-2 pt-1">
                    <textarea id="botDocPasteArea" rows="2" data-i18n-placeholder="botDocPlaceholder" placeholder="Paste conversation / document data here or attach photo/file..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-posterYellow"></textarea>
                    <div class="flex items-center justify-between">
                        <span id="botPhotoStatusText" class="text-[11px] text-slate-400"></span>
                        <button type="button" onclick="document.getElementById('botPhotoUploadInput').click()" class="px-2.5 py-1 rounded-lg bg-cyberBlue hover:bg-blue-600 text-white font-bold text-[11px]" data-i18n="botUploadPhotoBtn">
                            📷 Attach Photo / Doc
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Graph Maximize Modal -->
    <div id="graphZoomModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="comic-card w-full max-w-5xl rounded-2xl p-5 bg-matteBlack text-white max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-700">
                <h3 id="zoomModalTitle" class="poster-title text-2xl text-posterYellow">MAXIMIZED GRAPH VIEW</h3>
                <button type="button" onclick="closeZoomModal()" class="px-3 py-1 bg-cyberBlue text-white rounded-lg font-bold text-xs">CLOSE ✕</button>
            </div>
            <div id="zoomModalBody" class="flex-1 overflow-auto flex items-center justify-center p-2"></div>
        </div>
    </div>

    <!-- Main Container (Full Width) -->
    <div id="dashboardExportRoot" class="w-full max-w-none space-y-6">

        <!-- 1. TOP NAV -->
        <nav class="comic-card rounded-2xl px-4 py-3 flex flex-wrap items-center justify-between gap-3 border-cyberBlue relative">
            <div class="flex items-center gap-2.5">
                <button type="button" onclick="toggleTopQuickMenu()" class="w-9 h-9 rounded-xl bg-posterYellow text-matteBlack border border-slate-900 flex items-center justify-center font-bold text-base shadow hover:scale-105 transition" title="Quick Sections">
                    ☰
                </button>
                <span class="w-3 h-3 rounded-full bg-cyberBlue animate-ping"></span>
                <span class="poster-title text-base sm:text-lg tracking-wider" data-i18n="brandTitle">
                    SHIV PREM SYSTEMATIC AI GROWTH AND WEALTH BUILDING
                </span>
            </div>

            <!-- Dropdown Menu Opened by Top Left Icon -->
            <div id="topQuickMenuDrawer" class="hidden absolute left-4 top-16 z-40 flex flex-col gap-1 bg-panelDark border-2 border-cyberBlue rounded-2xl p-2 shadow-[4px_4px_0px_#000] text-xs font-mono min-w-[225px]">
                <button type="button" onclick="scrollToSection('sec-portfolio')" class="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-cyberBlue/20 text-white text-left">
                    <span>💼</span> <span>Portfolio</span>
                </button>
                <button type="button" onclick="scrollToSection('sec-payment-model')" class="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-cyberBlue/20 text-white text-left">
                    <span>💳</span> <span>Payment &amp; Spend Summary</span>
                </button>
                <button type="button" onclick="scrollToSection('sec-personal-growth')" class="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-cyberBlue/20 text-white text-left">
                    <span>🌱</span> <span>Personal Growth</span>
                </button>
                <button type="button" onclick="scrollToSection('sec-financial-growth')" class="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-cyberBlue/20 text-white text-left">
                    <span>📈</span> <span>Financial Growth</span>
                </button>
                <button type="button" onclick="scrollToSection('sec-growth-progress')" class="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-cyberBlue/20 text-white text-left">
                    <span>📊</span> <span>Growth Progress</span>
                </button>
                <button type="button" onclick="scrollToSection('sec-business')" class="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-cyberBlue/20 text-white text-left">
                    <span>🚀</span> <span>ONLY BUSINESS INCOME</span>
                </button>
                <div class="border-t border-slate-700 my-1"></div>
                <button type="button" onclick="exportWholeData()" class="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-emeraldGrowth/20 text-emeraldGrowth font-bold text-left">
                    <span>⬇</span> <span>Export Whole Data</span>
                </button>
                <button type="button" onclick="triggerImportWholeData()" class="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-posterYellow/20 text-posterYellow font-bold text-left">
                    <span>⬆</span> <span>Import Whole Data</span>
                </button>
            </div>

            <div class="flex flex-wrap items-center gap-2 relative">
                <!-- Single Top Download Icon Button Categorizing PDF & Docs -->
                <div class="relative">
                    <button type="button" onclick="toggleTopDownloadMenu()" class="px-3 py-1.5 rounded-xl bg-posterYellow hover:bg-yellow-300 text-matteBlack border border-slate-900 font-mono text-xs font-extrabold shadow flex items-center gap-1.5 transition" title="Download PDF or Docs">
                        <span>⬇</span>
                        <span>Download</span>
                    </button>
                    <div id="topDownloadCategoryMenu" class="hidden absolute right-0 top-11 z-40 flex flex-col gap-1 bg-panelDark border-2 border-posterYellow rounded-2xl p-2 shadow-[4px_4px_0px_#000] text-xs font-mono min-w-[165px]">
                        <div class="px-2.5 py-1 text-[10px] uppercase tracking-wider text-slate-400 font-bold">Select Format</div>
                        <button type="button" onclick="downloadAsPDF()" class="flex items-center justify-between px-3 py-2 rounded-xl hover:bg-cyberBlue/20 text-white font-bold text-left">
                            <span>📄 PDF</span>
                            <span class="text-[10px] text-posterYellow">.PDF</span>
                        </button>
                        <button type="button" onclick="downloadAsDocs()" class="flex items-center justify-between px-3 py-2 rounded-xl hover:bg-emeraldGrowth/20 text-white font-bold text-left">
                            <span>📝 Docs</span>
                            <span class="text-[10px] text-emeraldGrowth">.DOC</span>
                        </button>
                    </div>
                </div>

                <div class="inset-box px-3 py-1 rounded-xl font-mono text-xs font-bold text-cyberBlue flex items-center gap-2">
                    <span id="liveDateDisplay">---</span>
                    <span>•</span>
                    <span id="liveTimeDisplay" class="text-posterYellow">--:--:--</span>
                </div>

                <div class="flex items-center rounded-xl border-2 border-slate-700 overflow-hidden bg-slate-900 p-0.5">
                    <button type="button" onclick="setLanguage('en')" id="lang-en" class="px-3 py-1 rounded-lg text-xs font-bold bg-posterYellow text-matteBlack transition">EN</button>
                    <button type="button" onclick="setLanguage('ta')" id="lang-ta" class="px-3 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition">தமிழ்</button>
                </div>
                <button type="button" onclick="toggleThemeMode()" id="themeToggleBtn" class="px-3 py-1.5 rounded-xl border-2 border-slate-700 bg-slate-900 text-posterYellow text-xs font-bold transition">
                    <span id="themeIcon">☀️</span> <span id="themeLabel" data-i18n="themeWhite">White</span>
                </button>
            </div>
        </nav>

        <!-- 2. PROFILE HERO BANNER -->
        <header class="comic-card rounded-2xl p-4 sm:p-6 border-cyberBlu
